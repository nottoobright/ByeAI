; Logging config for gunicorn, passed via --log-config in the byeai systemd unit.
;
; Why this file exists: the access log was written WITHOUT timestamps, which made
; it impossible to date incidents (a 58k-error spike could not be attributed to a
; date during the 2026-08 investigation).
;
; Why gunicorn's --access-logformat does NOT work here: the worker class is
; uvicorn.workers.UvicornWorker. UvicornWorker copies gunicorn's access/error
; handlers onto the "uvicorn.access"/"uvicorn.error" loggers and writes the whole
; request line as the log *message*, so gunicorn's own access_log_format is never
; applied. Attaching a formatter to the handler here is what actually stamps the
; line, because uvicorn inherits these handlers.
;
; Note gunicorn applies this file AFTER --access-logfile/--error-logfile, so the
; file paths must be repeated here. They must stay in sync with the glob in
; /etc/logrotate.d/byeai (/var/log/byeai/*.log).

[loggers]
keys=root,gunicorn.error,gunicorn.access

[handlers]
keys=console,error_file,access_file

[formatters]
keys=stamped,access

; Root stays on stderr so application logs (main.py's logger, slowapi rate-limit
; warnings) keep reaching the systemd journal, which is how they are observed via
; `journalctl -u byeai`. Do not point root at a file -- that would silence them.
[logger_root]
level=INFO
handlers=console

[logger_gunicorn.error]
level=INFO
handlers=error_file
propagate=0
qualname=gunicorn.error

[logger_gunicorn.access]
level=INFO
handlers=access_file
propagate=0
qualname=gunicorn.access

[handler_console]
class=StreamHandler
formatter=stamped
args=(sys.stderr,)

; Append mode is required: logrotate uses copytruncate, which relies on the
; process holding the fd in O_APPEND so writes resume at the new EOF.
[handler_error_file]
class=logging.FileHandler
formatter=stamped
args=('/var/log/byeai/error.log', 'a')

[handler_access_file]
class=logging.FileHandler
formatter=access
args=('/var/log/byeai/access.log', 'a')

[formatter_stamped]
format=%(asctime)s [%(process)d] [%(levelname)s] %(message)s
datefmt=%Y-%m-%d %H:%M:%S %z

[formatter_access]
format=%(asctime)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S %z
