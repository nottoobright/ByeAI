<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ByeAI — Your Stats</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           margin: 0; padding: 24px; background: #fafafa; color: #1a1a1a; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .big-number { font-size: 48px; font-weight: 700; color: #dc3545; line-height: 1; }
    .label { color: #666; font-size: 13px; margin-top: 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .cat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .cat-row:last-child { border-bottom: none; }
    .bar-wrap { display: flex; align-items: end; gap: 4px; height: 120px; padding-top: 8px; }
    .bar { flex: 1; background: #dc3545; border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
    .bar:hover::after { content: attr(data-count) ' on ' attr(data-day); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
    .empty { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <h1>🚩 Your ByeAI Stats</h1>
  <div class="subtitle" id="since"></div>

  <div class="card">
    <div class="big-number" id="total">0</div>
    <div class="label">videos hidden so far</div>
  </div>

  <div class="card">
    <h2>Last 30 days</h2>
    <div class="bar-wrap" id="bars"></div>
  </div>

  <div class="card">
    <h2>By category</h2>
    <div id="categories"></div>
  </div>

  <script src="constants.js"></script>
  <script src="stats.js"></script>
</body>
</html>
